# Candidate for the ReSpeaker 2-Mic HAT; do not install without verifying the
# negotiated PCM period/buffer and a working hardware-specific rollback.
# The previous Pi configuration negotiated 125-ms periods and 375-ms buffers
# even though the application requested 10-ms frames.

defaults.pcm.rate_converter "samplerate"

pcm.!default {
    type asym
    playback.pcm "playback"
    capture.pcm "capture"
}

pcm.playback {
    type plug
    slave.pcm "dmixed"
}

pcm.capture {
    type plug
    slave.pcm "array"
}

pcm.dmixed {
    type dmix
    ipc_key 555555
    slave {
        pcm "hw:seeed2micvoicec"
        channels 2
        format S16_LE
        rate 48000
        period_size 480
        buffer_size 1920
    }
}

pcm.array {
    type dsnoop
    ipc_key 666666
    slave {
        pcm "hw:seeed2micvoicec"
        channels 2
        format S16_LE
        rate 48000
        period_size 480
        buffer_size 1920
    }
}
